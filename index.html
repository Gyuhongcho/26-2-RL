<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연세대 마을버스 노선 실험</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf2f5;color:#112a3b;font:15px system-ui,sans-serif}
main{max-width:1200px;margin:auto;padding:28px 20px}h1{font-size:clamp(24px,4vw,34px);margin:0 0 10px}
p{margin:0 0 16px;color:#476171}.panel{background:#fff;border:1px solid #cddae1;border-radius:14px;overflow:hidden}
.controls,.stats{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 16px}
button,select,input{font:inherit}button,select{padding:8px 12px;border:1px solid #9cafbd;border-radius:7px;background:white;color:inherit}
button{cursor:pointer;background:#134f68;color:white}.stats{border-top:1px solid #cddae1}.stats span{min-width:112px}
.stats strong{display:block;font-size:20px}#map{height:clamp(360px,61vh,720px);background:#dce7e9}
.bus{font-size:25px;text-align:center;filter:drop-shadow(0 2px 3px #0006)}.final-route{padding:12px 16px;background:#fff5dc;border-top:1px solid #d9bd83}
.caption{padding:12px 16px;font-size:13px;margin:0}
.comparison-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.comparison-card h2,.comparison-card p{margin:12px 14px}
.comparison-card h2{font-size:19px}.result-map{height:340px;background:#dce7e9}
@media(max-width:850px){.comparison-grid{grid-template-columns:1fr}}
</style>
<main>
<h1>연세대 마을버스 노선 실험</h1>
<p id="status" role="status">학습 기록 불러오는 중</p>
<section id="simulation" class="panel">
<div class="controls">
<button id="toggle" type="button">일시정지</button>
<label>경로 <select id="mode"><option value="recent">최근 학습 경로</option><option value="best">에피소드 최고 보상 노선</option></select></label>
<button id="show-best" disabled>에피소드 최고 노선 보기</button>
<button id="show-final" type="button" aria-pressed="false" disabled>🏆 전체 최고 노선</button>
<label>재생 속도 <input id="speed" type="range" min="1" max="5" value="3"></label>
</div>
<div id="map" aria-label="정류장 위치와 버스 이동 경로"></div>
<p id="winner" class="caption" aria-live="polite">첫 에피소드가 끝나면 최고 보상 노선이 표시됩니다.</p>
<div id="final-route" class="final-route" hidden>
<strong id="final-summary"></strong>
<ol id="final-stops"></ol>
</div>
<div class="stats">
<span>라운드<strong id="episode">—</strong></span>
<span>누적 보상<strong id="score">—</strong></span>
<span>누적 이동거리<strong id="distance">—</strong></span>
<span>출발점<strong id="origin">—</strong></span>
<span>현재 정류장<strong id="stop">—</strong></span>
</div>
<p id="route-note" class="caption">주황색은 우선 거점</p>
</section>
<section id="comparison" hidden><div id="comparison-grid" class="comparison-grid"></div></section>
</main>
<script>
const byId = id => document.getElementById(id);
const status = byId("status");
const compare = new URLSearchParams(location.search).has("compare");
const methodLabels = {
  random: {name:"Random", color:"#117073"},
  greedy: {name:"이용량 대비 거리 Greedy", color:"#99521b"},
  dqn: {name:"DQN + ε-greedy", color:"#5841a0"},
  "monte-carlo": {name:"Monte Carlo Control", color:"#244f86"},
  "q-learning": {name:"Q-learning", color:"#117073"},
  sarsa: {name:"SARSA", color:"#5841a0"}
};
let methods = [];
let comparisonRounds = 0;
let comparisonComplete = false;
let stage = 0;
const mode = byId("mode");
const playback = {running:!matchMedia("(prefers-reduced-motion: reduce)").matches, snapshot:null, run:null, index:0, t:0, hold:0, queue:[], seen:0};
const runName = new URLSearchParams(location.search).get("run");
if (runName && !/^[A-Za-z0-9_-]+$/.test(runName)) throw new Error("잘못된 실행 이름");
const map = L.map("map").setView([37.559,126.943], 14);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
const finalLine = L.polyline([], {color:"#a54e00",weight:7});
const finalMarkers = L.layerGroup();
let finalVisible = false;
const routeLine = L.polyline([], {color:"#027c80",weight:5}).addTo(map);
const bus = L.marker([37.559,126.943], {icon:L.divIcon({className:"bus",html:"🚌",iconSize:[34,34],iconAnchor:[17,17]}),interactive:false,zIndexOffset:500}).addTo(map);
let network;
const markers = L.layerGroup().addTo(map);

function point(i) { const stop = network.stops[i]; return [stop.lat,stop.lon]; }
function readout() {
  const p = playback;
  const traveled = p.run.path.slice(0,p.index+1);
  const meters = p.run.prefix_distances_m?.[p.index] ?? traveled.slice(1).reduce((total,stop,i) => total + network.distances_m[traveled[i]][stop],0);
  byId("episode").textContent = p.run.round ?? p.run.episode ?? p.snapshot.progress;
  byId("score").textContent = p.run.rewards.slice(0,p.index).reduce((a,b)=>a+b,0).toFixed(2);
  byId("distance").textContent = `${(meters/1000).toFixed(2)} km`;
  byId("origin").textContent = network.stops[p.run.path[0]].name;
  byId("stop").textContent = network.stops[traveled.at(-1)].name;
}
let cursor = 0;
function nextRun() {
  const p = playback;
  const snapshot = p.snapshot;
  if (!snapshot) return;
  if (mode.value === "recent") {
    p.run = p.queue.shift() || snapshot.recent[cursor++ % snapshot.recent.length];
  } else {
    const routes = (snapshot.winners || snapshot.best || []).flat();
    if (!routes.length) return;
    p.run = routes[cursor++ % routes.length];
  }
  p.index = 0; p.t = 0; p.hold = 0;
  p.legs = p.run.road_legs?.map(coordinates => coordinates.map(([lon,lat]) => [lat,lon]));
  const origin = p.legs?.[0]?.[0] ?? point(p.run.path[0]);
  bus.setLatLng(origin).setOpacity(1);
  routeLine.setStyle({dashArray:p.legs ? null : "5 7"});
  routeLine.setLatLngs([origin]);
  byId("route-note").textContent = p.legs
    ? "차량 도로 경로 재생 · 주황색은 우선 거점"
    : "점선과 버스 움직임은 정류장 방문 순서 · 거리는 도로거리 기준";
  readout();
}
function updateToggle() {
  byId("toggle").textContent = playback.running ? "일시정지" : "재생";
}
updateToggle();
byId("toggle").onclick = () => { playback.running = !playback.running; updateToggle(); };
byId("show-best").onclick = () => {
  mode.value = "best";
  cursor = (playback.snapshot.winners || playback.snapshot.best).length - 1;
  nextRun();
};
mode.onchange = () => { cursor = 0; nextRun(); };

byId("show-final").onclick = () => {
  const winner = playback.snapshot.overall_best;
  if (!winner) return;
  finalVisible = !finalVisible;
  byId("show-final").setAttribute("aria-pressed", String(finalVisible));
  byId("final-route").hidden = !finalVisible;
  for (const id of ["toggle", "mode", "show-best", "speed"]) byId(id).disabled = finalVisible;
  if (!finalVisible) {
    finalLine.remove();
    finalMarkers.remove();
    routeLine.addTo(map);
    bus.addTo(map);
    map.fitBounds(network.stops.map((_,i)=>point(i)), {padding:[32,32]});
    return;
  }
  routeLine.remove();
  bus.remove();
  const points = winner.path.map(point);
  const line = winner.road_geometry?.coordinates.map(([lon,lat]) => [lat,lon]);
  finalLine.setStyle({dashArray:line ? null : "5 7"});
  finalLine.setLatLngs(line ?? points).addTo(map);
  finalMarkers.clearLayers().addTo(map);
  const items = winner.path.map((index, order) => {
    const label = document.createElement("span");
    label.textContent = `${order + 1}. ${network.stops[index].name}`;
    L.circleMarker(point(index), {radius:7, color:"#a54e00", fillColor:"#fff5dc", fillOpacity:1})
      .bindTooltip(label).addTo(finalMarkers);
    const item = document.createElement("li");
    item.textContent = network.stops[index].name;
    return item;
  });
  byId("final-stops").replaceChildren(...items);
  byId("final-summary").textContent = `전체 최고 보상 ${winner.score.toFixed(2)} · ${(winner.distance_m/1000).toFixed(2)} km · 에피소드 ${winner.episode}, 라운드 ${winner.round}${line ? "" : " · 점선은 방문 순서"}`;
  map.fitBounds(line ?? points, {padding:[42,42], maxZoom:17});
};
let last = performance.now();
function frame(now) {
  const delta = Math.min(now-last,50);
  last = now;
  const p = playback;
  if (!finalVisible && p.running && p.run) {
    const path = p.run.path;
    if (p.index === path.length-1) {
      p.hold += delta;
      if (p.hold >= 850) nextRun();
    } else {
      p.t = Math.min(1,p.t + delta*Number(byId("speed").value)/1600);
      const line = p.legs?.[p.index] ?? [point(path[p.index]), point(path[p.index+1])];
      if (line) {
        const lengths = [0];
        for (let i = 1; i < line.length; i++)
          lengths.push(lengths[i-1] + map.distance(line[i-1], line[i]));
        const target = p.t * lengths.at(-1);
        const segment = lengths.findIndex((length, i) => i > 0 && length >= target);
        const fraction = segment > 0 ? (target - lengths[segment-1]) /
          (lengths[segment] - lengths[segment-1] || 1) : 0;
        const location = segment > 0
          ? line[segment-1].map((value,i) => value + (line[segment][i]-value)*fraction)
          : line[0];
        bus.setLatLng(location);
        const partial = [...line.slice(0, Math.max(segment,1)), location];
        routeLine.setLatLngs(p.legs ? [...p.legs.slice(0,p.index), partial]
          : [...path.slice(0,p.index).map(point), ...partial]);
      }
      if (p.t === 1) { p.index++; p.t=0; readout(); }
    }
  }
  if (!comparisonComplete) requestAnimationFrame(frame);
}
async function load(url) {
  const response = await fetch(url,{cache:"no-store"});
  if (response.status === 204) return null;
  if (!response.ok) throw new Error(`${response.status} ${url}`);
  return response.json();
}
async function showComparison() {
  const snapshots = await Promise.all(methods.map(method => load(`${method.id}/trace.json`)));
  const roadData = await load("road_geometry.json").catch(() => null);
  const roadRoutes = snapshots.map((snapshot, index) => {
    const winner = snapshot.overall_best;
    if (winner.road_geometry) return {geometry:winner.road_geometry, distance_m:winner.distance_m, enforced:true};
    const saved = roadData?.[methods[index].id];
    const coordinates = snapshot.overall_best.path.map(i => [snapshot.stops[i].lon,snapshot.stops[i].lat]);
    return saved && JSON.stringify(saved.waypoints) === JSON.stringify(coordinates) ? saved : null;
  });
  const grid = byId("comparison-grid");
  grid.replaceChildren();
  byId("simulation").hidden = true;
  byId("comparison").hidden = false;
  playback.running = false;
  status.textContent = `${methods.length + 1} / ${methods.length + 1} · 방법별 최고 보상 노선 · 도로거리 상한 ${(snapshots[0].budget_m/1000).toFixed(2)} km`;
  const bounds = snapshots.flatMap(snapshot =>
    snapshot.overall_best.path.map(i => [snapshot.stops[i].lat,snapshot.stops[i].lon]));
  bounds.push(...roadRoutes.flatMap(road => road ? road.geometry.coordinates.map(([lon,lat]) => [lat,lon]) : []));
  snapshots.forEach((snapshot, index) => {
    const method = methods[index];
    const winner = snapshot.overall_best;
    const card = document.createElement("article");
    card.className = "panel comparison-card";
    const heading = document.createElement("h2");
    heading.textContent = method.name;
    const metrics = document.createElement("p");
    metrics.textContent = `보상 ${winner.score.toFixed(2)} · ${(winner.distance_m/1000).toFixed(2)} km · ${winner.path.length}개 정류장`;
    const surface = document.createElement("div");
    surface.className = "result-map";
    surface.setAttribute("aria-label", `${method.name} 최고 보상 노선 지도`);
    const route = document.createElement("p");
    route.textContent = winner.path.map(i => snapshot.stops[i].name).join(" → ");
    const road = roadRoutes[index];
    const geometryNote = document.createElement("p");
    geometryNote.textContent = road?.enforced
      ? `OSRM 연속 도로 경로 · 거리 상한 충족`
      : road ? `OSRM 차량 경로 ${(road.distance_m/1000).toFixed(2)} km · 정류장 연결 최대 오차 ${road.max_snap_m.toFixed(0)} m`
      : "점선은 정류장 방문 순서 · 거리는 도로거리 기준";
    card.append(heading, metrics, surface, geometryNote, route);
    grid.append(card);
    const resultMap = L.map(surface, {zoomControl:false, dragging:false,
      scrollWheelZoom:false, doubleClickZoom:false, touchZoom:false, boxZoom:false, keyboard:false});
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(resultMap);
    const points = winner.path.map(i => [snapshot.stops[i].lat,snapshot.stops[i].lon]);
    if (road) {
      L.geoJSON(road.geometry, {style:{color:method.color,weight:5}}).addTo(resultMap);
      if (!road.enforced) resultMap.attributionControl.addAttribution('Routing: <a href="https://routing.openstreetmap.de/about.html">FOSSGIS OSRM</a> · <a href="https://www.openstreetmap.org/fixthemap">지도 오류 수정</a>');
    } else {
      L.polyline(points, {color:method.color,weight:4,dashArray:"5 7"}).addTo(resultMap);
    }
    points.forEach((point, order) => {
      const label = document.createElement("span");
      label.textContent = `${order + 1}. ${snapshot.stops[winner.path[order]].name}`;
      L.circleMarker(point, {radius:5,color:method.color,fillColor:"#fff",fillOpacity:1})
        .bindTooltip(label).addTo(resultMap);
    });
    resultMap.fitBounds(bounds,{padding:[24,24],maxZoom:16});
  });
}

async function poll() {
  try {
    let url = runName ? `runs/${runName}/trace.json` : "trace.json";
    if (compare) {
      const manifest = await load("comparison.json");
      if (!manifest || !manifest.stage) return;
      methods = (manifest.methods || ["q-learning", "monte-carlo", "sarsa"])
        .map(id => ({id, ...methodLabels[id]}));
      comparisonRounds = manifest.rounds || 100;
      if (manifest.stage === methods.length + 1) {
        await showComparison();
        comparisonComplete = true;
        return;
      }
      if (manifest.stage !== stage) {
        stage = manifest.stage;
        playback.run = null;
        playback.queue = [];
        playback.seen = 0;
        playback.snapshot = null;
        mode.value = "recent";
        finalVisible = false;
        byId("final-route").hidden = true;
        finalLine.remove();
        finalMarkers.remove();
        routeLine.addTo(map);
        bus.addTo(map);
        byId("show-final").setAttribute("aria-pressed", "false");
        for (const id of ["toggle", "mode", "speed"]) byId(id).disabled = false;
        byId("show-best").disabled = true;
        byId("show-final").disabled = true;
        byId("winner").textContent = `${comparisonRounds.toLocaleString()}회 중 최고 보상 경로를 기록합니다.`;
      }
      url = `${methods[stage-1].id}/trace.json`;
    }
    const snapshot = await load(url);
    if (!snapshot) return;
    if (!network || snapshot.stops.map(s=>s.id).join() !== network.stops.map(s=>s.id).join()) {
      renderStops(snapshot);
      playback.run = null;
      playback.queue = [];
      playback.seen = 0;
    }
    if (!snapshot.recent.length) {
      status.textContent = "첫 라운드 학습 중";
      return;
    }
    const p = playback;
    if (snapshot.progress < p.seen) { p.seen=0; p.queue=[]; p.run=null; }
    p.queue = [...p.queue,...snapshot.recent.filter(run=>(run.round ?? run.episode)>p.seen)].slice(-30);
    p.seen=snapshot.progress;
    p.snapshot=snapshot;
    if (!p.run) nextRun();
    const size = snapshot.config.rounds_per_episode || 1;
    const total = snapshot.config.episodes * size;
    const round = (snapshot.progress - 1) % size + 1;
    const episode = Math.ceil(snapshot.progress / size);
    const budget = snapshot.config.steps ? ` · 전이 ${snapshot.steps} / ${snapshot.config.steps}` : ` · 전체 ${snapshot.progress} / ${total}`;
    status.textContent = `${snapshot.config.algo} · ${snapshot.finished ? "학습 종료 · 경로 재생 중" : "학습 중"} · 에피소드 ${episode}, 라운드 ${round} / ${size}${budget}`;
    byId("show-final").disabled = !(snapshot.finished && snapshot.overall_best);
    if (compare) status.textContent =
      `${stage} / ${methods.length + 1} · ${methods[stage-1].name} · ${snapshot.progress.toLocaleString()} / ${comparisonRounds.toLocaleString()}회`;
    const winner = (snapshot.winners || snapshot.best || []).at(-1);
    if (winner) {
      const names = winner.path.map(i => network.stops[i].name);
      byId("winner").textContent = `에피소드 ${winner.episode} 최고 보상 ${winner.score.toFixed(2)} · ${(winner.distance_m / 1000).toFixed(2)} km · ${names.join(" → ")}`;
      byId("show-best").disabled = finalVisible;
    }

  } catch (error) {
    status.textContent = `학습 기록 대기 중 · ${error.message}`;
  } finally {
    if (!comparisonComplete) setTimeout(poll, compare ? 350 : 1200);
  }
}
function renderStops(data) {
  network=data;
  markers.clearLayers();
  map.fitBounds(network.stops.map((_,i)=>point(i)),{padding:[32,32]});
  network.stops.forEach((stop,i)=>{
    const label=document.createElement("span");
    label.textContent=stop.name+(stop.hub ? ` · ${stop.hub_name || stop.hub}` : "");
    L.circleMarker(point(i),{radius:stop.hub?7:4,weight:2,color:"#fff",fillColor:stop.hub?"#c46413":"#335a75",fillOpacity:1}).bindTooltip(label).addTo(markers);
  });
}
poll();
requestAnimationFrame(frame);
</script>
</html>
